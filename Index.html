<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>MyRecipes</title>

<!-- PWA / iOS home screen -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#007aff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="MyRecipes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />

<style>
  :root {
    --accent: #007aff;
    --accent-contrast: #ffffff;
    --bg: #f2f2f7;
    --card-bg: #ffffff;
    --separator: #d1d1d6;
    --text: #000000;
    --text-secondary: #8e8e93;
    --danger: #ff3b30;
    --nav-height: 44px;
    --tab-height: 49px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* Navigation bar (per-screen header) */
  .nav-bar {
    flex: 0 0 auto;
    padding-top: var(--safe-top);
    background: var(--accent);
    color: var(--accent-contrast);
  }
  .nav-bar-inner {
    height: var(--nav-height);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 12px;
  }
  .nav-title {
    font-size: 17px;
    font-weight: 600;
  }
  .nav-btn {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    background: none;
    border: none;
    color: var(--accent-contrast);
    font-size: 17px;
    padding: 0 8px;
    cursor: pointer;
  }
  .nav-btn.left { left: 4px; }
  .nav-btn.right { right: 4px; }

  /* Screens */
  .screens {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
  }
  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: none;
  }
  .screen.active { display: block; }

  .placeholder {
    padding: 24px 16px;
    color: var(--text-secondary);
    text-align: center;
  }

  /* Grouped list style (iOS Settings-like) */
  .group-header {
    padding: 20px 16px 6px;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .list-card {
    background: var(--card-bg);
    margin: 0 0 8px;
  }
  .list-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--separator);
    background: var(--card-bg);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row .row-title { flex: 1; font-size: 17px; }

  /* Bottom Tab Bar */
  .tab-bar {
    flex: 0 0 auto;
    display: flex;
    background: rgba(249, 249, 249, 0.94);
    border-top: 1px solid var(--separator);
    padding-bottom: var(--safe-bottom);
    backdrop-filter: blur(10px);
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    height: var(--tab-height);
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 10px;
    cursor: pointer;
  }
  .tab-btn .tab-icon { font-size: 22px; line-height: 1; }
  .tab-btn.active { color: var(--accent); }

  button, input, select, textarea {
    font-family: inherit;
  }

  /* Search bar */
  .search-bar-wrap {
    padding: 8px 10px;
    background: var(--bg);
  }
  .search-input {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    background: #e3e3e8;
    font-size: 16px;
  }

  /* Overlay screen stack (pushed detail/edit screens) */
  .overlay-root {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
  }
  .overlay-screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform 0.28s ease;
    pointer-events: auto;
    display: flex;
    flex-direction: column;
  }
  .overlay-screen.active { transform: translateX(0); }
  .overlay-content {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Forms */
  .form-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 8px 16px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--separator);
  }
  .form-row label {
    width: 110px;
    flex: 0 0 auto;
    color: var(--text-secondary);
    font-size: 15px;
  }
  .form-row input[type="text"],
  .form-row input[type="number"],
  .form-row input[type="url"],
  .form-row select,
  .form-row textarea {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 17px;
    color: var(--text);
    min-width: 0;
  }
  .form-row textarea { min-height: 90px; resize: vertical; padding-top: 8px; }
  .form-row.tappable { cursor: pointer; }
  .form-row .chevron { color: var(--separator); }
  .danger-row {
    text-align: center;
    color: var(--danger);
    font-size: 17px;
    padding: 14px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--separator);
    cursor: pointer;
  }
  .add-row {
    text-align: center;
    color: var(--accent);
    font-size: 17px;
    padding: 12px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--separator);
    cursor: pointer;
  }

  /* Chip grid (toggles / emoji picker) */
  .chip-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 16px;
    background: var(--card-bg);
  }
  .chip {
    padding: 8px 12px;
    border-radius: 16px;
    background: #e5e5ea;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .chip.active { background: var(--accent); color: #fff; }
  .chip.emoji-chip { font-size: 22px; padding: 4px 8px; border-radius: 10px; }
  .chip.emoji-chip.active { background: var(--accent); }
  .extra-field-row { background: #f7f7fa; }

  /* Swipe to delete */
  .swipe-container { position: relative; overflow: hidden; }
  .swipe-content {
    position: relative;
    background: var(--card-bg);
    touch-action: pan-y;
  }
  .swipe-delete-btn {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 80px;
    background: var(--danger);
    color: #fff;
    border: none;
    font-size: 14px;
  }

  /* Star rating */
  .star-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--separator);
  }
  .star-row .member-name { flex: 1; font-size: 17px; }
  .stars { display: flex; gap: 2px; }
  .star { font-size: 22px; color: var(--separator); cursor: pointer; }
  .star.filled { color: #ff9500; }
  .rating-badge {
    font-size: 13px;
    color: var(--text-secondary);
    padding: 4px 8px;
  }

  /* Photo preview */
  .photo-preview {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
    background: #e5e5ea;
  }

  /* Menu recipe rows + footer */
  .menu-recipe-row .method-icons { font-size: 14px; text-align: right; }
  .menu-recipe-row .method-time { font-size: 11px; color: var(--text-secondary); display: block; text-align: right; }
  .menu-recipe-row .info-btn { color: var(--accent); font-size: 18px; padding: 0 4px; cursor: pointer; }
  .checkbox-circle {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--separator);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; cursor: pointer; flex: 0 0 auto;
  }

  /* Cooking Mode */
  .cooking-recipe-card {
    background: var(--card-bg);
    margin: 0 0 12px;
    padding: 14px 16px;
  }
  .cooking-recipe-card.done { opacity: 0.55; }
  .cooking-recipe-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .cooking-recipe-header .cr-name { font-size: 17px; font-weight: 600; flex: 1; }
  .cooking-recipe-header .cr-done-btn {
    border: none; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .cooking-toggle-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .cooking-toggle-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; cursor: pointer;
  }
  .cooking-toggle-item .ct-check {
    width: 20px; height: 20px; border-radius: 5px;
    border: 2px solid var(--separator);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; flex: 0 0 auto;
  }
  .cooking-toggle-item.checked .ct-check { background: var(--accent); border-color: var(--accent); }
  .cooking-toggle-item.checked .ct-label { text-decoration: line-through; color: var(--text-secondary); }
  .cooking-timer-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px 0;
    border-top: 1px solid var(--separator);
  }
  .cooking-timer-row .ct-timer-label { font-size: 15px; }
  .cooking-timer-controls { display: flex; align-items: center; gap: 8px; }
  .cooking-timer-display { font-size: 20px; font-variant-numeric: tabular-nums; min-width: 60px; text-align: right; }
  .cooking-timer-display.ringing { color: var(--danger); animation: cookingBlink 1s step-start infinite; }
  @keyframes cookingBlink { 50% { opacity: 0.2; } }
  .cooking-timer-btn {
    border: none; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .cooking-timer-btn.secondary { background: var(--separator); color: var(--text); }
  .cooking-link-row {
    display: flex; gap: 16px; margin-top: 8px;
    font-size: 14px; color: var(--accent);
  }
  .cooking-link-row span { cursor: pointer; }

  .cooking-info-photo {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    cursor: zoom-in;
    display: block;
  }
  .cooking-info-link {
    display: inline-block;
    margin-bottom: 12px;
    color: var(--accent);
    font-size: 15px;
    word-break: break-all;
  }

  /* Full-screen zoomable image lightbox */
  .lightbox-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    touch-action: pinch-zoom;
  }
  .lightbox-overlay img {
    max-width: 100%;
    max-height: 100%;
    touch-action: pinch-zoom;
    cursor: zoom-out;
  }

  .strikethrough { text-decoration: line-through; color: var(--text-secondary); }

  /* Admin screen */
  .color-swatch-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--separator);
  }
  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .color-swatch.selected { border-color: var(--text); }
  .lang-switch-row {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--card-bg);
    border-bottom: 1px solid var(--separator);
  }
  .lang-switch-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--separator);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  .lang-switch-btn.active {
    background: var(--accent);
    color: var(--accent-contrast);
    border-color: var(--accent);
  }

  .menu-footer {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(249, 249, 249, 0.96);
    border-top: 1px solid var(--separator);
    backdrop-filter: blur(10px);
  }
  .menu-footer button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="app">
  <div class="nav-bar">
    <div class="nav-bar-inner">
      <button class="nav-btn left" id="nav-left-btn" style="display:none;"></button>
      <span class="nav-title" id="nav-title">Menus</span>
      <button class="nav-btn right" id="nav-right-btn" style="display:none;"></button>
    </div>
  </div>

  <div class="screens">
    <section class="screen active" data-screen="menus">
      <div class="search-bar-wrap"><input type="text" id="menus-search" class="search-input" placeholder="Search"/></div>
      <div id="menus-list"></div>
    </section>
    <section class="screen" data-screen="recipes">
      <div class="search-bar-wrap"><input type="text" id="recipes-search" class="search-input" placeholder="Search"/></div>
      <div id="recipes-list"></div>
    </section>
    <section class="screen" data-screen="shopping">
      <div class="search-bar-wrap"><input type="text" id="shopping-search" class="search-input" placeholder="Search"/></div>
      <div id="shopping-list"></div>
    </section>
    <section class="screen" data-screen="ingredients">
      <div class="search-bar-wrap"><input type="text" id="ingredients-search" class="search-input" placeholder="Search"/></div>
      <div id="ingredients-list"></div>
    </section>
    <section class="screen" data-screen="admin">
      <div id="admin-content"></div>
    </section>
  </div>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="menus">
      <span class="tab-icon">📋</span><span data-i18n="tab.menus">Menus</span>
    </button>
    <button class="tab-btn" data-tab="recipes">
        <span class="tab-icon">🍔</span><span data-i18n="tab.recipes">Recipes</span>
    </button>
    <button class="tab-btn" data-tab="shopping">
      <span class="tab-icon">🛒</span><span data-i18n="tab.shopping">Shopping</span>
    </button>
    <button class="tab-btn" data-tab="ingredients">
      <span class="tab-icon">🥕</span><span data-i18n="tab.ingredients">Products</span>
    </button>
    <button class="tab-btn" data-tab="admin">
      <span class="tab-icon">⚙️</span><span data-i18n="tab.admin">Admin</span>
    </button>
  </nav>
</div>

<div class="overlay-root" id="overlay-root"></div>


<script>
(function () {
  "use strict";

  /* =========================================================
     i18n
     ========================================================= */
  const STRINGS = {
    en: {
      "tab.menus": "Menus",
      "tab.recipes": "Recipes",
      "tab.shopping": "Shopping",
      "tab.ingredients": "Products",
      "tab.admin": "Admin",
      "nav.menus": "Menus",
      "nav.recipes": "Recipes",
      "nav.shopping": "Shopping List",
      "nav.ingredients": "Products",
      "nav.admin": "Admin",
      "admin.familyMembers": "Family Members",
      "admin.addMember": "Add Family Member",
      "admin.memberName": "Name",
      "admin.settings": "Settings",
      "admin.language": "Language",
      "admin.accentColor": "Accent Color"
    },
    ro: {
      "tab.menus": "Meniuri",
      "tab.recipes": "Rețete",
      "tab.shopping": "Cumpărături",
      "tab.ingredients": "Produse",
      "tab.admin": "Admin",
      "nav.menus": "Meniuri",
      "nav.recipes": "Rețete",
      "nav.shopping": "Listă cumpărături",
      "nav.ingredients": "Produse",
      "nav.admin": "Admin",
      "admin.familyMembers": "Membrii familiei",
      "admin.addMember": "Adaugă membru",
      "admin.memberName": "Nume",
      "admin.settings": "Setări",
      "admin.language": "Limbă",
      "admin.accentColor": "Culoare accent"
    }
  };

  const I18N = {
    lang: localStorage.getItem("myrecipes.lang") || "en",
    t(key) {
      const dict = STRINGS[I18N.lang] || STRINGS.en;
      return dict[key] || STRINGS.en[key] || key;
    },
    setLang(lang) {
      if (!STRINGS[lang]) return;
      I18N.lang = lang;
      localStorage.setItem("myrecipes.lang", lang);
      I18N.applyAll();
    },
    applyAll() {
      document.documentElement.lang = I18N.lang;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = I18N.t(el.getAttribute("data-i18n"));
      });
      const navTitle = document.getElementById("nav-title");
      const activeTab = document.querySelector(".tab-btn.active");
      if (navTitle && activeTab) {
        navTitle.textContent = I18N.t("nav." + activeTab.dataset.tab);
      }
    }
  };
  window.I18N = I18N;

  /* =========================================================
     Accent color (applied instantly from localStorage,
     synced with the Settings store once IndexedDB is open)
     ========================================================= */
  const savedColor = localStorage.getItem("myrecipes.accentColor");
  if (savedColor) {
    document.documentElement.style.setProperty("--accent", savedColor);
  }
  window.setAccentColor = function (hex) {
    document.documentElement.style.setProperty("--accent", hex);
    localStorage.setItem("myrecipes.accentColor", hex);
    DB.put("settings", { id: "accentColor", value: hex });
  };

  /* =========================================================
     IndexedDB wrapper
     ========================================================= */
  const DB_NAME = "MyRecipesDB";
  const DB_VERSION = 2;
  let dbInstance = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;

        if (!db.objectStoreNames.contains("recipes")) {
          const store = db.createObjectStore("recipes", { keyPath: "id" });
          store.createIndex("categoryId", "categoryId", { unique: false });
          store.createIndex("updatedAt", "updatedAt", { unique: false });
        }
        if (!db.objectStoreNames.contains("ingredients")) {
          const store = db.createObjectStore("ingredients", { keyPath: "id" });
          store.createIndex("categoryId", "categoryId", { unique: false });
          store.createIndex("usageCount", "usageCount", { unique: false });
          store.createIndex("updatedAt", "updatedAt", { unique: false });
        }
        if (!db.objectStoreNames.contains("recipeCategories")) {
          const store = db.createObjectStore("recipeCategories", { keyPath: "id" });
          store.createIndex("sortOrder", "sortOrder", { unique: false });
        }
        if (!db.objectStoreNames.contains("ingredientCategories")) {
          const store = db.createObjectStore("ingredientCategories", { keyPath: "id" });
          store.createIndex("sortOrder", "sortOrder", { unique: false });
        }
        if (!db.objectStoreNames.contains("menus")) {
          const store = db.createObjectStore("menus", { keyPath: "id" });
          store.createIndex("date", "date", { unique: false });
          store.createIndex("updatedAt", "updatedAt", { unique: false });
        }
        if (!db.objectStoreNames.contains("cookingSessions")) {
          const store = db.createObjectStore("cookingSessions", { keyPath: "id" });
          store.createIndex("recipeId", "recipeId", { unique: false });
          store.createIndex("endDateTime", "endDateTime", { unique: false });
        }
        if (!db.objectStoreNames.contains("familyMembers")) {
          db.createObjectStore("familyMembers", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("settings")) {
          db.createObjectStore("settings", { keyPath: "id" });
        }
        if (!db.objectStoreNames.contains("shoppingList")) {
          const store = db.createObjectStore("shoppingList", { keyPath: "id" });
          store.createIndex("createdAt", "createdAt", { unique: false });
        }
      };

      request.onsuccess = (event) => {
        dbInstance = event.target.result;
        dbInstance.onversionchange = () => {
          dbInstance.close();
          dbInstance = null;
        };
        resolve(dbInstance);
      };
      request.onerror = (event) => reject(event.target.error);
      request.onblocked = () => {
        console.warn("IndexedDB upgrade blocked by another open tab/connection.");
        reject(new Error("IndexedDB upgrade blocked. Please close other tabs/windows of this app and reload."));
      };
    });
  }

  function withStore(storeName, mode, callback) {
    return openDB().then((db) => {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, mode);
        const store = tx.objectStore(storeName);
        const result = callback(store);
        tx.oncomplete = () => resolve(result && result.__result);
        tx.onerror = () => reject(tx.error);
      });
    });
  }

  const DB = {
    open: openDB,
    getAll(storeName) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    },
    get(storeName, id) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    },
    put(storeName, record) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = () => reject(tx.error);
      }));
    },
    delete(storeName, id) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    },
    clear(storeName) {
      return openDB().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      }));
    }
  };
  window.DB = DB;

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      const v = c === "x" ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }
  window.uuid = uuid;

    await seedSampleData();

<script>
(function () {
  "use strict";

  /* =========================================================
     Screen stack (push/pop full-screen overlays)
     ========================================================= */
  const overlayRoot = document.getElementById("overlay-root");

  function pushScreen({ title, left, right, render }) {
    const el = document.createElement("div");
    el.className = "overlay-screen";
    el.innerHTML =
      '<div class="nav-bar"><div class="nav-bar-inner">' +
      '<button class="nav-btn left" data-nav="left"></button>' +
      '<span class="nav-title"></span>' +
      '<button class="nav-btn right" data-nav="right"></button>' +
      "</div></div>" +
      '<div class="overlay-content"></div>';
    el.querySelector(".nav-title").textContent = title || "";
    overlayRoot.appendChild(el);
    requestAnimationFrame(() => el.classList.add("active"));

    const content = el.querySelector(".overlay-content");
    const leftBtn = el.querySelector('[data-nav="left"]');
    const rightBtn = el.querySelector('[data-nav="right"]');

    function close() {
      el.classList.remove("active");
      setTimeout(() => el.remove(), 300);
    }
    function refresh() {
      content.innerHTML = "";
      render(content, refresh, close);
    }

    if (left) {
      leftBtn.textContent = left.label || "";
      leftBtn.addEventListener("click", () => (left.action ? left.action(close, refresh) : close()));
    }
    if (right) {
      rightBtn.textContent = right.label || "";
      rightBtn.addEventListener("click", () => right.action(close, refresh));
    }

    render(content, refresh, close);
    return { close, refresh, element: el };
  }
  window.pushScreen = pushScreen;

  /* =========================================================
     Swipe-to-delete helper
     ========================================================= */
  function makeSwipeable(rowEl, onDelete) {
    const wrapper = document.createElement("div");
    wrapper.className = "swipe-container";
    rowEl.classList.add("swipe-content");
    rowEl.parentNode.insertBefore(wrapper, rowEl);
    wrapper.appendChild(rowEl);

    const delBtn = document.createElement("button");
    delBtn.className = "swipe-delete-btn";
    delBtn.textContent = I18N.lang === "ro" ? "Șterge" : "Delete";
    wrapper.appendChild(delBtn);
    delBtn.addEventListener("click", () => onDelete());

    let startX = 0, currentX = 0, dragging = false;
    rowEl.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      dragging = true;
      rowEl.style.transition = "none";
    }, { passive: true });
    rowEl.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      let dx = e.touches[0].clientX - startX + currentX;
      dx = Math.min(0, Math.max(dx, -80));
      rowEl.style.transform = "translateX(" + dx + "px)";
      rowEl.dataset.dx = dx;
    }, { passive: true });
    rowEl.addEventListener("touchend", () => {
      dragging = false;
      rowEl.style.transition = "transform 0.2s";
      const dx = parseFloat(rowEl.dataset.dx || "0");
      if (dx < -40) {
        rowEl.style.transform = "translateX(-80px)";
        currentX = -80;
      } else {
        rowEl.style.transform = "translateX(0)";
        currentX = 0;
      }
    });
    return wrapper;
  }
  window.makeSwipeable = makeSwipeable;

  /* =========================================================
     Categories
     ========================================================= */
  const FOOD_EMOJIS = ["🍎","🥕","🥩","🐟","🍞","🧀","🥛","🥚","🍚","🍝","🌿","🧂","🍋","🍇","🥔","🧅","🧄","🌶️","🥦","🍄","🍯","🥜","🍫","🧊","🥤","☕","🍰","🍕","🥫","🍉"];

  function getCategoryStore(kind) {
    return kind === "recipe" ? "recipeCategories" : "ingredientCategories";
  }

  async function getCategoriesSorted(kind) {
    const list = await DB.getAll(getCategoryStore(kind));
    return list.sort((a, b) => (a.sortOrder ?? 0) - (b.sortOrder ?? 0));
  }
  window.getCategoriesSorted = getCategoriesSorted;
  window.getCategoryStore = getCategoryStore;

  async function createCategory(kind, name, icon) {
    const store = getCategoryStore(kind);
    const cats = await DB.getAll(store);
    const maxOrder = cats.reduce((m, c) => Math.max(m, c.sortOrder ?? 0), -1);
    const cat = { id: uuid(), name, icon, sortOrder: maxOrder + 1, updatedAt: nowISO() };
    await DB.put(store, cat);
    return cat;
  }
  window.createCategory = createCategory;

  function openNewCategoryScreen(kind, onCreated, prefillName) {
    let selectedEmoji = FOOD_EMOJIS[0];
    let currentName = prefillName || "";
    const isRo = I18N.lang === "ro";
    const screen = pushScreen({
      title: isRo ? "Categorie nouă" : "New Category",
      left: { label: isRo ? "Anulează" : "Cancel" },
      right: {
        label: isRo ? "Salvează" : "Save",
        action: async (close) => {
          const nameInput = screen.element.querySelector("#cat-name");
          const customInput = screen.element.querySelector("#cat-custom-emoji");
          const name = (nameInput.value || currentName).trim();
          if (!name) { nameInput.focus(); return; }
          const icon = (customInput.value.trim() || selectedEmoji);
          const cat = await createCategory(kind, name, icon);
          close();
          onCreated && onCreated(cat);
        }
      },
      render(content) {
        content.innerHTML =
          '<div class="form-row"><label>' + (isRo ? "Nume" : "Name") + '</label><input type="text" id="cat-name" value="' + escapeAttr(currentName) + '" placeholder="' + (isRo ? "ex: Legume" : "e.g. Produce") + '"/></div>' +
          '<div class="group-header">' + (isRo ? "Icon" : "Icon") + '</div>' +
          '<div class="chip-grid" id="emoji-grid">' +
          FOOD_EMOJIS.map((e, i) => '<div class="chip emoji-chip' + (i === 0 ? " active" : "") + '" data-emoji="' + e + '">' + e + "</div>").join("") +
          "</div>" +
          '<div class="form-row"><label>' + (isRo ? "Personalizat" : "Custom") + '</label><input type="text" id="cat-custom-emoji" maxlength="4" placeholder="🙂"/></div>';
        const nameInput = content.querySelector("#cat-name");
        attachAutoCapitalize(nameInput, (val) => { currentName = val; });
        content.querySelectorAll(".emoji-chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            content.querySelectorAll(".emoji-chip").forEach((c) => c.classList.remove("active"));
            chip.classList.add("active");
            selectedEmoji = chip.dataset.emoji;
            content.querySelector("#cat-custom-emoji").value = "";
          });
        });
      }
    });
    return screen;
  }

  function openCategoryPicker(kind, currentId, onSelect) {
    const isRo = I18N.lang === "ro";
    const screen = pushScreen({
      title: isRo ? "Categorie" : "Category",
      left: { label: isRo ? "Închide" : "Close" },
      async render(content) {
        const cats = await getCategoriesSorted(kind);
        content.innerHTML =
          '<div class="add-row" id="add-cat-row">+ ' + (isRo ? "Categorie nouă" : "New Category") + "</div>" +
          '<div class="list-card">' +
          cats.map((c) =>
            '<div class="list-row tappable" data-cat-id="' + c.id + '">' +
            '<span>' + c.icon + "</span><span class=\"row-title\">" + c.name + "</span>" +
            (c.id === currentId ? '<span>✓</span>' : "") +
            "</div>"
          ).join("") +
          "</div>";
        content.querySelector("#add-cat-row").addEventListener("click", () => {
          openNewCategoryScreen(kind, (cat) => { onSelect(cat); screen.close(); });
        });
        content.querySelectorAll("[data-cat-id]").forEach((row) => {
          row.addEventListener("click", async () => {
            const cats2 = await getCategoriesSorted(kind);
            const cat = cats2.find((c) => c.id === row.dataset.catId);
            onSelect(cat);
            screen.close();
          });
        });
      }
    });
    return screen;
  }
  window.openCategoryPicker = openCategoryPicker;

  /* =========================================================
     Image compression helper
     ========================================================= */
  function compressImageFile(file, maxDim, quality) {
    maxDim = maxDim || 1024;
    quality = quality || 0.8;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
          else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* =========================================================
     Common measurement units
     ========================================================= */
  const COMMON_UNITS = ["kg", "g", "l", "ml", "buc", "lingură", "linguriță", "pachet", "fir", "felie"];

  /* =========================================================
     Ingredients
     ========================================================= */
  async function openIngredientEditor(ingredientId, onSaved, prefillName) {
    const isRo = I18N.lang === "ro";
    const isNew = !ingredientId;
    let ingredient = isNew
      ? { id: uuid(), categoryId: null, name: prefillName || "", note: "", units: [], excludeFromShoppingList: false, usageCount: 0 }
      : await DB.get("ingredients", ingredientId);
    let selectedCategory = ingredient.categoryId ? await DB.get("ingredientCategories", ingredient.categoryId) : null;

    const screen = pushScreen({
      title: isNew ? (isRo ? "Produs nou" : "New Product") : (isRo ? "Editează produs" : "Edit Product"),
      left: { label: isRo ? "Anulează" : "Cancel" },
      right: {
        label: isRo ? "Salvează" : "Save",
        action: async (close) => {
          const nameInput = screen.element.querySelector("#ing-name");
          const noteInput = screen.element.querySelector("#ing-note");
          const excludeInput = screen.element.querySelector("#ing-exclude");
          const name = nameInput.value.trim();
          if (!name) { nameInput.focus(); return; }
          ingredient.name = name;
          ingredient.note = noteInput.value.trim();
          ingredient.excludeFromShoppingList = excludeInput.checked;
          ingredient.categoryId = selectedCategory ? selectedCategory.id : null;
          ingredient.updatedAt = nowISO();
          if (ingredient.usageCount == null) ingredient.usageCount = 0;
          await DB.put("ingredients", ingredient);
          close();
          onSaved && onSaved();
        }
      },
      render(content, refresh) {
        content.innerHTML =
          '<div class="form-row"><label>' + (isRo ? "Nume" : "Name") + '</label><input type="text" id="ing-name" value="' + escapeAttr(ingredient.name) + '"/></div>' +
          '<div class="form-row tappable" id="ing-cat-row"><label>' + (isRo ? "Categorie" : "Category") + '</label><span style="flex:1">' + (selectedCategory ? selectedCategory.icon + " " + selectedCategory.name : (isRo ? "Fără categorie" : "None")) + '</span><span class="chevron">›</span></div>' +
          '<div class="form-row"><label>' + (isRo ? "Notă" : "Note") + '</label><input type="text" id="ing-note" value="' + escapeAttr(ingredient.note || "") + '"/></div>' +
          '<div class="form-row"><label style="width:auto;flex:1">' + (isRo ? "Exclude din lista de cumpărături" : "Exclude from shopping list") + '</label><input type="checkbox" id="ing-exclude" ' + (ingredient.excludeFromShoppingList ? "checked" : "") + "/></div>" +
          '<div class="group-header">' + (isRo ? "Unități" : "Units") + "</div>" +
          '<div class="list-card" id="ing-units-list">' +
          (ingredient.units || []).map((u, idx) =>
            '<div class="list-row" data-unit-idx="' + idx + '"><span class="row-title">' + u.unit + " — " + (isRo ? "implicit" : "default") + " " + u.defaultQty + '</span><span class="danger-remove-unit" style="color:var(--danger);cursor:pointer;">✕</span></div>'
          ).join("") +
          "</div>" +
          '<div class="add-row" id="add-unit-row">+ ' + (isRo ? "Adaugă unitate" : "Add unit") + "</div>" +
          (isNew ? "" : '<div class="danger-row" id="delete-ing-row">' + (isRo ? "Șterge produs" : "Delete Product") + "</div>");

        attachAutoCapitalize(content.querySelector("#ing-name"), (val) => { ingredient.name = val; });
        content.querySelector("#ing-note").addEventListener("input", (e) => { ingredient.note = e.target.value; });
        content.querySelector("#ing-exclude").addEventListener("change", (e) => { ingredient.excludeFromShoppingList = e.target.checked; });

        content.querySelector("#ing-cat-row").addEventListener("click", () => {
          openCategoryPicker("ingredient", selectedCategory ? selectedCategory.id : null, (cat) => {
            selectedCategory = cat;
            refresh();
          });
        });

        content.querySelectorAll(".danger-remove-unit").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const idx = parseInt(e.target.closest("[data-unit-idx]").dataset.unitIdx, 10);
            ingredient.units.splice(idx, 1);
            refresh();
          });
        });

        content.querySelector("#add-unit-row").addEventListener("click", () => {
          const unit = prompt(isRo ? "Nume unitate (ex: kg, buc)" : "Unit name (e.g. kg, pcs)", COMMON_UNITS[0]);
          if (!unit) return;
          const qtyStr = prompt(isRo ? "Cantitate implicită" : "Default quantity", "1");
          const qty = parseFloat(qtyStr);
          if (!qtyStr || isNaN(qty)) return;
          ingredient.units = ingredient.units || [];
          ingredient.units.push({ unit: unit.trim(), defaultQty: qty });
          refresh();
        });

        const deleteRow = content.querySelector("#delete-ing-row");
        if (deleteRow) {
          deleteRow.addEventListener("click", async () => {
            if (!confirm(isRo ? "Ștergi acest ingredient?" : "Delete this ingredient?")) return;
            await DB.delete("ingredients", ingredient.id);
            screen.close();
            onSaved && onSaved();
          });
        }
      }
    });
  }
  window.openIngredientEditor = openIngredientEditor;

  function escapeAttr(str) {
    return (str || "").replace(/"/g, "&quot;");
  }
  function escapeHtml(str) {
    return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  window.escapeAttr = escapeAttr;
  window.escapeHtml = escapeHtml;
  function capitalizeFirstLetter(str) {
    if (!str) return str;
    return str.charAt(0).toUpperCase() + str.slice(1);
  }
  function attachAutoCapitalize(inputEl, onChange) {
    inputEl.addEventListener("input", () => {
      const val = inputEl.value;
      const capped = capitalizeFirstLetter(val);
      if (capped !== val) {
        const pos = inputEl.selectionStart;
        inputEl.value = capped;
        inputEl.setSelectionRange(pos, pos);
      }
      onChange && onChange(inputEl.value);
    });
  }
  window.capitalizeFirstLetter = capitalizeFirstLetter;
  window.attachAutoCapitalize = attachAutoCapitalize;

  async function renderIngredientsScreen() {
    const listEl = document.getElementById("ingredients-list");
    const searchInput = document.getElementById("ingredients-search");
    if (!listEl) return;

    async function draw() {
      const filter = (searchInput.value || "").toLowerCase();
      const [ingredients, categories] = await Promise.all([
        DB.getAll("ingredients"),
        getCategoriesSorted("ingredient")
      ]);
      const filtered = ingredients.filter((i) => i.name.toLowerCase().includes(filter));
      const catById = Object.fromEntries(categories.map((c) => [c.id, c]));
      const groups = new Map();
      const noCategory = [];
      filtered.forEach((ing) => {
        if (ing.categoryId && catById[ing.categoryId]) {
          if (!groups.has(ing.categoryId)) groups.set(ing.categoryId, []);
          groups.get(ing.categoryId).push(ing);
        } else {
          noCategory.push(ing);
        }
      });

      listEl.innerHTML = "";
      categories.forEach((cat) => {
        const items = groups.get(cat.id);
        if (!items || !items.length) return;
        listEl.appendChild(buildGroup(cat.icon + " " + cat.name, items));
      });
      if (noCategory.length) {
        listEl.appendChild(buildGroup(I18N.lang === "ro" ? "Fără categorie" : "No Category", noCategory));
      }

      function buildGroup(title, items) {
        const wrap = document.createElement("div");
        const header = document.createElement("div");
        header.className = "group-header";
        header.textContent = title;
        wrap.appendChild(header);
        const card = document.createElement("div");
        card.className = "list-card";
        items.sort((a, b) => a.name.localeCompare(b.name)).forEach((ing) => {
          const row = document.createElement("div");
          row.className = "list-row tappable";
          const unitsLabel = (ing.units && ing.units.length)
            ? ing.units.map((u) => u.defaultQty + " " + escapeHtml(u.unit)).join(", ")
            : "";
          row.innerHTML = '<span class="row-title">' + escapeHtml(ing.name) + "</span>" + (unitsLabel ? '<span class="rating-badge">' + unitsLabel + "</span>" : "");
          row.addEventListener("click", () => openIngredientEditor(ing.id, draw));
          card.appendChild(row);
          makeSwipeable(row, async () => {
            await DB.delete("ingredients", ing.id);
            draw();
          });
        });
        wrap.appendChild(card);
        return wrap;
      }

  /* =========================================================
     Ingredient picker (used when adding ingredients to a recipe)
     ========================================================= */
  function openIngredientPicker(existingIds, onAdd) {
    const isRo = I18N.lang === "ro";
    let addNewHandler = null;
    const screen = pushScreen({
      title: isRo ? "Caută produs" : "Search Product",
      left: { label: isRo ? "Terminat" : "Done" },
      right: {
        label: "+ " + (isRo ? "Adaugă" : "Add"),
        action: () => { addNewHandler && addNewHandler(); }
      },
      async render(content, refresh) {
        const all = await DB.getAll("ingredients");
        all.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));

        content.innerHTML =
          '<div class="search-bar-wrap"><input type="text" id="picker-search" class="search-input" placeholder="' + (isRo ? "Caută..." : "Search...") + '"/></div>' +
          '<div class="group-header">' + (isRo ? "Rezultate" : "Search results") + '</div>' +
          '<div class="list-card" id="picker-results"></div>';

        const rightBtn = screen.element.querySelector('[data-nav="right"]');
        rightBtn.style.display = "none";
        const searchInput = content.querySelector("#picker-search");
        const resultsEl = content.querySelector("#picker-results");
        let expandedId = null;

        function drawResults() {
          const filter = (searchInput.value || "").toLowerCase();
          const filtered = all.filter((i) => i.name.toLowerCase().includes(filter));
          rightBtn.style.display = (filter && filtered.length === 0) ? "inline-flex" : "none";
          resultsEl.innerHTML = filtered.map((ing) => {
            const added = existingIds.has(ing.id);
            const isExpanded = expandedId === ing.id;
            let extra = "";
            if (isExpanded) {
              const units = (ing.units && ing.units.length) ? ing.units : [{ unit: COMMON_UNITS[0], defaultQty: 1 }];
              const defaultUnit = units[0];
              extra =
                '<div class="form-row extra-field-row"><label>' + (isRo ? "Cantitate" : "Quantity") + '</label>' +
                '<input type="number" id="qty-input" value="' + defaultUnit.defaultQty + '" step="any"/>' +
                '<select id="unit-select">' +
                units.map((u) => '<option value="' + escapeAttr(u.unit) + '">' + u.unit + "</option>").join("") +
                COMMON_UNITS.filter((cu) => !units.some((u) => u.unit === cu)).map((cu) => '<option value="' + cu + '">' + cu + "</option>").join("") +
                "</select></div>";
            }
            return '<div class="picker-row-wrap" data-ing-id="' + ing.id + '">' +
              '<div class="list-row tappable"><span>' + (added ? "✅" : "⬜️") + '</span><span class="row-title' + (added ? '" style="text-decoration:line-through;color:var(--text-secondary)' : '') + '">' + escapeHtml(ing.name) + "</span></div>" +
              extra +
              "</div>";
          }).join("");

          resultsEl.querySelectorAll(".picker-row-wrap").forEach((wrap) => {
            const id = wrap.dataset.ingId;
            const ing = all.find((i) => i.id === id);
            const mainRow = wrap.querySelector(".list-row");
            mainRow.addEventListener("click", () => {
              if (existingIds.has(id)) return; // already added, ignore
              if (expandedId !== id) {
                expandedId = id;
                drawResults();
                return;
              }
              // second tap -> confirm add with current/default values
              confirmAdd(ing);
            });
            const qtyInput = wrap.querySelector("#qty-input");
            const unitSelect = wrap.querySelector("#unit-select");
            if (qtyInput && unitSelect) {
              [qtyInput, unitSelect].forEach((el) => {
                el.addEventListener("click", (e) => e.stopPropagation());
              });
              qtyInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") { confirmAdd(ing, qtyInput.value, unitSelect.value); }
              });
            }
          });
        }

        async function confirmAdd(ing, qtyOverride, unitOverride) {
          if (existingIds.has(ing.id)) return; // safety guard, don't add twice
          const wrap = resultsEl.querySelector('[data-ing-id="' + ing.id + '"]');
          const qtyInput = wrap.querySelector("#qty-input");
          const unitSelect = wrap.querySelector("#unit-select");
          const qty = parseFloat(qtyOverride !== undefined ? qtyOverride : (qtyInput ? qtyInput.value : 1)) || 1;
          const unit = unitOverride !== undefined ? unitOverride : (unitSelect ? unitSelect.value : (ing.units[0] ? ing.units[0].unit : COMMON_UNITS[0]));

          // auto-learn new unit for this ingredient
          ing.units = ing.units || [];
          if (!ing.units.some((u) => u.unit === unit)) {
            ing.units.push({ unit, defaultQty: qty });
          }
          ing.usageCount = (ing.usageCount || 0) + 1;
          ing.updatedAt = nowISO();
          await DB.put("ingredients", ing);

          existingIds.add(ing.id);
          onAdd({ ingredientId: ing.id, name: ing.name, unit, quantity: qty });
          expandedId = null;
          searchInput.value = "";
          searchInput.focus();
          drawResults();
        }

        searchInput.addEventListener("input", drawResults);
        addNewHandler = () => {
          const prefillName = capitalizeFirstLetter(searchInput.value.trim());
          openIngredientEditor(null, async () => {
            const refreshed = await DB.getAll("ingredients");
            all.length = 0;
            all.push(...refreshed);
            all.sort((a, b) => (b.usageCount || 0) - (a.usageCount || 0));
            drawResults();
          }, prefillName);
        };

        drawResults();
        searchInput.select();
      }
    });
    return screen;
  }
  window.openIngredientPicker = openIngredientPicker;

  function avgRating(ratings) {
    const vals = Object.values(ratings || {}).filter((v) => v > 0);
    if (!vals.length) return null;
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }

  async function openRatingPopup(recipe, onSaved) {

      title: isRo ? "Evaluare" : "Rating",

      right: {

        content.innerHTML = members.map((m) => {

          let stars = "";
          for (let i = 1; i <= 5; i++) {
